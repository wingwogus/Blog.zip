services:
  postgres:
    image: postgres:18-alpine
    container_name: blogzip-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: blogzip
      POSTGRES_USER: blogzip
      POSTGRES_PASSWORD: blogzip
    volumes:
      - blogzip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blogzip -d blogzip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  blogzip-postgres-data:
