spring:
  config:
    activate:
      on-profile: local

  # 로컬도 운영과 같은 PostgreSQL을 쓴다. H2를 쓰지 않는다.
  # 이유는 docs/decisions/001-database-selection.md 2장에 있다.
  # 먼저 `docker compose up -d`로 컨테이너를 띄운다.
  datasource:
    url: jdbc:postgresql://localhost:5432/blogzip
    username: blogzip
    password: blogzip

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

app:
  auth:
    # 로컬 전용. 이 값은 커밋된 파일에 두지 않고 각자 환경변수로 넣는다.
    # 없으면 기동이 실패하므로 최초 1회 아래 명령으로 생성해 셸 프로필에 넣는다.
    #   export JWT_SECRET=$(openssl rand -hex 32)
    refresh-cookie-secure: false

logging:
  level:
    com.blogzip: DEBUG
    org.hibernate.SQL: DEBUG
